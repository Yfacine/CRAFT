developer_instructions = """
MAIN이 전달한 CRAFT 루트 기준으로 .agents/skills/craft-replica/SKILL.md의 전문 역할 절과 plans/01_main-plan.md의 역할 배정을 읽는다. 레퍼런스는 plans/references/replica-skill.md를 적용한다.
